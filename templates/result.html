<!DOCTYPE html>
<html>
<head>
    <title>Analysis Result</title>
</head>
<body>
    <h2>Resume Analysis Result</h2>

    <p><b>Match Percentage:</b> {{ match_percentage }}%</p>

    <h3>Matched Skills:</h3>
    <ul>
        {% for skill in matched_skills %}
            <li>{{ skill }}</li>
        {% endfor %}
    </ul>

    <a href="/">Analyze Another Resume</a>
</body>
</html>
